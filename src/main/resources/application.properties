spring.application.name=PCPView

# Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pcpview}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:pcpview}
spring.datasource.password=${DB_PASSWORD:pcpview}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Migracoes do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Chave secreta JWT
api.security.token.secret=${JWT_SECRET:dev-secret-key-change-in-production}
